<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacts · Spamer's Admin Panel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-md navbar-dark admin-header">
    <div class="container-fluid">
      <a class="navbar-brand" href="/">Spamer's Admin Panel</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="/">Send email</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="/contacts.html">Contacts</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/emails.html">Sent emails</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container-fluid admin-content">
    <h1>Contacts</h1>

    <div class="row">
      <div class="col-lg-8">
        <div class="card">
          <div class="card-header">
            <h2>All contacts</h2>
          </div>
          <div class="table-responsive">
            <table class="table">
              <thead>
                <tr>
                  <th>Full name</th>
                  <th>Email</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="contacts-list">
                <tr><td colspan="3" class="text-muted">Loading...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="col-lg-4">
        <div class="card">
          <div class="card-header">
            <h2>Add contact</h2>
          </div>
          <div class="card-body">
            <form id="add-contact-form">
              <div class="mb-3">
                <label class="form-label required">Surname</label>
                <input type="text" class="form-control" name="surname" required>
              </div>
              <div class="mb-3">
                <label class="form-label required">First name</label>
                <input type="text" class="form-control" name="firstName" required>
              </div>
              <div class="mb-3">
                <label class="form-label required">Email</label>
                <input type="email" class="form-control" name="email" required>
              </div>
              <button type="submit" class="btn btn-primary">Save</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div class="modal" id="edit-modal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title">Change contact</h2>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="edit-contact-form">
            <input type="hidden" name="id">
            <div class="mb-3">
              <label class="form-label required">Surname</label>
              <input type="text" class="form-control" name="surname" required>
            </div>
            <div class="mb-3">
              <label class="form-label required">First name</label>
              <input type="text" class="form-control" name="firstName" required>
            </div>
            <div class="mb-3">
              <label class="form-label required">Email</label>
              <input type="email" class="form-control" name="email" required>
            </div>
            <button type="submit" class="btn btn-primary">Save</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <div class="toast-container position-fixed top-0 end-0 p-3">
    <div id="toast" class="toast" role="alert">
      <div class="toast-header">
        <strong class="me-auto" id="toast-title">Message</strong>
        <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
      </div>
      <div class="toast-body" id="toast-message"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/constants.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/contacts.js"></script>
</body>
</html>
