<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sent emails · Spamer's Admin Panel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-md navbar-dark admin-header">
    <div class="container-fluid">
      <a class="navbar-brand" href="/">Spamer's Admin Panel</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="/">Send email</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/contacts.html">Contacts</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="/emails.html">Sent emails</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container-fluid admin-content">
    <h1>Sent emails</h1>

    <div class="card">
      <div class="card-header">
        <h2>History</h2>
      </div>
      <div class="table-responsive">
        <table class="table">
          <thead>
            <tr>
              <th>Date</th>
              <th>Subject</th>
              <th>Message</th>
              <th>Recipients</th>
              <th>Sent</th>
              <th>Failed</th>
            </tr>
          </thead>
          <tbody id="emails-list">
            <tr><td colspan="6" class="text-muted">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <div class="toast-container position-fixed top-0 end-0 p-3">
    <div id="toast" class="toast" role="alert">
      <div class="toast-header">
        <strong class="me-auto" id="toast-title">Message</strong>
        <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
      </div>
      <div class="toast-body" id="toast-message"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/constants.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/emails.js"></script>
</body>
</html>
