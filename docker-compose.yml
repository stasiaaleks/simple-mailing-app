version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: mailing-app-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?set MONGO_USER in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?set MONGO_PASSWORD in .env}
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
